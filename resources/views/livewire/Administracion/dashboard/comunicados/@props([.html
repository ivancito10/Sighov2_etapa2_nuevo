<script>
document.addEventListener("DOMContentLoaded", function() {
    const carouselEl = document.getElementById("{{ $id }}");
    const carousel = new bootstrap.Carousel(carouselEl, {
        ride: false,
        interval: false // ⚡ Evita que avance solo
    });
    const videos = carouselEl.querySelectorAll("video");

    function playActiveVideo() {
        videos.forEach(v => {
            v.pause();
            v.currentTime = 0;
            v.muted = true;
        });

        const activeVideo = carouselEl.querySelector(".carousel-item.active video");
        if (activeVideo) {
            activeVideo.addEventListener('canplaythrough', () => {
                activeVideo.muted = false;
                activeVideo.play().catch(() => {});
            }, { once: true });

            activeVideo.load();
        }
    }

    playActiveVideo();

    videos.forEach(video => {
        video.addEventListener("ended", () => {
            carousel.next();
        });
    });

    carouselEl.addEventListener("slid.bs.carousel", () => {
        playActiveVideo();
    });
});
</script>
